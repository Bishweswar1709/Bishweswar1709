name: Update GitHub Streak

on:

  # Update every day
  schedule:
    - cron: "15 0 * * *"

  # Allow manual updates
  workflow_dispatch:

permissions:
  contents: write


jobs:

  generate-streak:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # Checkout repository
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------
      # Setup Python
      # --------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # --------------------------------------------
      # Generate streak SVG
      # --------------------------------------------

      - name: Generate streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python scripts/generate_streak.py


      # --------------------------------------------
      # Commit SVG
      # --------------------------------------------

      - name: Commit generated SVG
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-streak.svg

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "chore: update github streak"

            git push

          fi
